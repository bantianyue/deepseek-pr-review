name: DeepSeek PR Review (self-test)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: bantianyue/deepseek-pr-review@main
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          advisory: "true"
